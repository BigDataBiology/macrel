[uwsgi]
; uwsgi protocol (for nginx's uwsgi_pass), not plain HTTP
socket = 127.0.0.1:8000
chdir = %d
wsgi-file = api.py
callable = app
buffer-size = 32768
master = true
; exit on SIGTERM (default is to reload), as systemd expects
die-on-term = true
processes = 4
; kill requests stuck for more than 5 minutes
harakiri = 300
; cap uploads at 50MB
limit-post = 50000000
